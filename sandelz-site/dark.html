<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <title>dark XP page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #080808;
      color: #e6e6e6;
      min-height: 100vh;
    }
    .window {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 40px auto 60px;
      background: #121212;
      border: 2px solid #444;
      box-shadow: 8px 8px 0 rgba(0,0,0,.35);
      padding: 18px;
    }
    header {
      background: linear-gradient(90deg,#202020,#2b2b2b);
      color: #ff4c4c;
      padding: 14px 16px;
      border: 2px solid #550000;
      margin: -18px -18px 18px;
      font-size: 2rem;
    }
    h2 {
      color: #dddddd;
      margin-top: 24px;
    }
    p, li {
      line-height: 1.6;
      color: #d0d0d0;
    }
    a {
      color: #ff7777;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    ul {
      margin-left: 22px;
    }
    hr {
      border: 0;
      border-top: 1px solid rgba(255,76,76,0.25);
      margin: 20px 0;
    }
    .button-link {
      display: inline-block;
      background: #181818;
      border: 2px outset #550000;
      color: #ff9999;
      padding: 8px 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="window">
    <header>Windows XP Dark</header>
    <p>this is the third page.</p>
    <hr>
    <h2>Political Opinions</h2>
    <p>I am a strong far-right individual.</p>
    <hr>
    <h2>Why you may ask</h2>
    <ul>
      <li>i think its a great ideology</li>
      <li>like national socialism</li>
      <li>and i have a feeling that it's the right path</li>
    </ul>
    <hr>
    <a class="button-link" href="index.html">Back to homepage</a>
  </div>
</body>
</html>
